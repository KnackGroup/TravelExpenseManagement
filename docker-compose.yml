services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: te-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: te-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/init.sh"]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: te-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TravelExpenseDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGIN}
      Frontend__BaseUrl: ${CORS_ALLOWED_ORIGIN}
      DataProtection__KeyPath: /app/keys
    volumes:
      - dataprotection-keys:/app/keys
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: te-frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  sqlserver-data:
  dataprotection-keys:
